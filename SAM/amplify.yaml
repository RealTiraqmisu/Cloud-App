Parameters:
  ApiBaseUrl:
    Type: String
    Default: https://YOUR_API_ID.execute-api.us-east-1.amazonaws.com/dev
    Description: API Gateway URL from the food-ordering stack
  
  AmplifyApp:
    Type: AWS::Amplify::App
    Properties:
      Name: food-ordering-frontend
      Repository: https://github.com/RealTiraqmisu/Cloud-App.git
      Platform: WEB
      BuildSpec: |
        version: 1
        frontend:
          phases:
            preBuild:
              commands:
                - npm ci
            build:
              commands:
                - npm run build
          artifacts:
            baseDirectory: dist
            files:
              - '**/*'
          cache:
            paths:
              - node_modules/**/*

      # สมมติเป็น React :
      EnvironmentVariables:
        - Name: VITE_API_BASE_URL
          Value: !Ref ApiBaseUrl
      # Frontend COde VV
      # const API_BASE_URL = import.meta.env.VITE_API_BASE_URL;

      # fetch(`${API_BASE_URL}/menu`)
      #   .then((response) => response.json())
      #   .then((data) => console.log(data));

  AmplifyBranch:
    Type: AWS::Amplify::Branch
    Properties:
      AppId: !GetAtt AmplifyApp.AppId
      BranchName: main
      EnableAutoBuild: true

# เหมือนสร้างแยกจะโอเคกว่า 
# แต่ถ้าใช้ yaml ต้องรอ setup git ก่อน เพราะต้องมี app ถึงจะ build ผ่าน
