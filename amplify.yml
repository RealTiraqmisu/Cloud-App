# AWS Amplify Hosting build spec (monorepo: frontend อยู่ในโฟลเดอร์ frontend/)
# Amplify อ่านไฟล์นี้จาก root ของ repo อัตโนมัติ และจะ override build settings ใน console
# ต้องมี Environment variable  AMPLIFY_MONOREPO_APP_ROOT = frontend  (ตรงกับ appRoot)
# คู่มือตั้งค่า: amplify-hosting/README.md
version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            # Vite 8 ต้องใช้ Node >= 20.19 / 22.12 → ใช้ Node 22 (เลขอยู่ใน frontend/.nvmrc)
            - nvm install "$(cat .nvmrc)" && nvm use "$(cat .nvmrc)"
            - node -v && npm -v
            - npm ci --no-audit --no-fund
        build:
          commands:
            # VITE_API_URL ถูกฝังลงไฟล์ JS ตอน build → ตั้งใน Amplify > Environment variables
            - 'if [ -n "$VITE_API_URL" ]; then echo "Using API: $VITE_API_URL"; else echo "WARNING: VITE_API_URL is empty -> site runs in MOCK mode"; fi'
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
